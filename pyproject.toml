[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caesar-cipher"
version = "1.0.0"
description = "A small Tkinter desktop app for Caesar cipher text encryption."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Caesar Cipher contributors" }
]
dependencies = []

[project.scripts]
caesar-cipher = "caesar_cipher.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]